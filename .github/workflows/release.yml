name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $manifest = Get-Content ./manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = [string]$manifest.version
          $tag = "v$version"
          $zipName = "bili-digest-plus-v$version.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_path=dist/$zipName" >> $env:GITHUB_OUTPUT

      - name: Static checks
        run: node scripts/check.js

      - name: Unit tests
        run: npm test

      - name: Build release package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Create checksum and release notes
        shell: pwsh
        run: |
          $zipPath = "${{ steps.meta.outputs.zip_path }}"
          $zipName = "${{ steps.meta.outputs.zip_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -LiteralPath ./dist/SHA256SUMS.txt -Encoding UTF8
          @"
          # Bili Digest Plus v${{ steps.meta.outputs.version }}

          本次正式发布对应 `main` 分支的 v0.4.2。

          ## 主要更新
          - B站原生字幕优先；无原生字幕时可手动使用 Groq Whisper 生成带时间轴字幕。
          - 支持 Whisper Large V3 / Whisper Large V3 Turbo，并保留本地 API Key 设置。
          - AI 字幕缓存与概览流程联动；需要时先生成字幕再继续概览。
          - 增强 Bilibili 媒体请求兼容性与音频获取回退。
          - 增强本机字体读取、字体选择和排版设置。
          - 调整侧边栏标签页与界面细节，保留现有翻译、对话、笔记与导出能力。
          - 使用广域 HTTPS host permission，以兼容 Groq 与用户自定义 HTTPS AI 端点。

          ## 安装
          1. 下载 `bili-digest-plus-v${{ steps.meta.outputs.version }}.zip`。
          2. 解压 ZIP。
          3. 打开 Chrome 扩展管理页并开启开发者模式。
          4. 选择“加载已解压的扩展程序”，指向解压后的目录。

          ## 完整性
          同一 Release 同时附带 `SHA256SUMS.txt`，可用于核对 ZIP 的 SHA-256。
          "@ | Set-Content -LiteralPath ./dist/release-notes.md -Encoding UTF8

      - name: Verify tag state before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $repo = $env:GITHUB_REPOSITORY
          $json = gh api "repos/$repo/git/ref/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $ref = $json | ConvertFrom-Json
            $target = [string]$ref.object.sha
            if ($ref.object.type -eq "tag") {
              $tagObject = (gh api "repos/$repo/git/tags/$target") | ConvertFrom-Json
              $target = [string]$tagObject.object.sha
            }
            if ($target -ne $env:GITHUB_SHA) {
              throw "Existing tag $tag points to $target, expected $env:GITHUB_SHA"
            }
          } else {
            $global:LASTEXITCODE = 0
          }

          gh release view $tag --repo $repo --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to overwrite it."
          }
          $global:LASTEXITCODE = 0

      - name: Publish GitHub Release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" `
            "${{ steps.meta.outputs.zip_path }}" `
            "dist/SHA256SUMS.txt" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Bili Digest Plus ${{ steps.meta.outputs.tag }}" `
            --notes-file "dist/release-notes.md"

      - name: Verify published Release, tag and downloaded asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $zipName = "${{ steps.meta.outputs.zip_name }}"
          $zipPath = "${{ steps.meta.outputs.zip_path }}"
          $repo = $env:GITHUB_REPOSITORY
          $expectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()

          $release = (gh release view $tag --repo $repo --json tagName,isDraft,isPrerelease,url,assets,targetCommitish) | ConvertFrom-Json
          if ($release.tagName -ne $tag) { throw "Release tag mismatch" }
          if ($release.isDraft) { throw "Release is still a draft" }
          if ($release.isPrerelease) { throw "Release is unexpectedly marked prerelease" }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($assetNames -notcontains $zipName) { throw "ZIP asset missing from Release" }
          if ($assetNames -notcontains "SHA256SUMS.txt") { throw "SHA256SUMS.txt asset missing from Release" }

          $ref = (gh api "repos/$repo/git/ref/tags/$tag") | ConvertFrom-Json
          $target = [string]$ref.object.sha
          if ($ref.object.type -eq "tag") {
            $tagObject = (gh api "repos/$repo/git/tags/$target") | ConvertFrom-Json
            $target = [string]$tagObject.object.sha
          }
          if ($target -ne $env:GITHUB_SHA) { throw "Tag target mismatch: $target != $env:GITHUB_SHA" }

          New-Item -ItemType Directory -Path ./verify -Force | Out-Null
          gh release download $tag --repo $repo --pattern $zipName --dir ./verify --clobber
          $downloadedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "./verify/$zipName").Hash.ToLowerInvariant()
          if ($downloadedHash -ne $expectedHash) {
            throw "Downloaded Release asset SHA-256 mismatch: $downloadedHash != $expectedHash"
          }

          Write-Host "Release URL: $($release.url)"
          Write-Host "Tag target: $target"
          Write-Host "ZIP SHA-256: $downloadedHash"
          Write-Host "Release verification passed."

      - name: Clean temporary release branches
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $branches = @(
            "release-v0.4.2-final",
            "release-v0.4.2-trigger",
            "release-v0.4.2-finalize",
            "chatgpt-groq-asr-build"
          )
          foreach ($branch in $branches) {
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch" 1>$null 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Deleted temporary branch: $branch"
            } else {
              Write-Host "Temporary branch already absent or not deletable: $branch"
              $global:LASTEXITCODE = 0
            }
          }
