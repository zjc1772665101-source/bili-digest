name: PiliPlus AI APK

on:
  push:
    branches: [piliplus-ai-apk]
    paths:
      - 'piliplus_ai/**'
      - '.github/workflows/piliplus-ai-apk.yml'
  workflow_dispatch:

concurrency:
  group: piliplus-ai-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration files
        uses: actions/checkout@v7
        with:
          path: integration

      - name: Checkout PiliPlus upstream
        uses: actions/checkout@v7
        with:
          repository: bggRGjQaUbCoE/PiliPlus
          ref: main
          path: app
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Apply PiliPlus AI integration
        run: python3 integration/piliplus_ai/apply.py app

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze AI integration
        working-directory: app
        run: flutter analyze lib/pages/video/ai_digest lib/pages/video/view.dart lib/pages/video/introduction/ugc/view.dart lib/common/widgets/video_popup_menu.dart --no-fatal-warnings --no-fatal-infos

      - name: Build isolated ARM64 APK
        working-directory: app
        run: >-
          flutter build apk --release --target-platform android-arm64
          --build-name=2.1.2-ai.1 --build-number=210201
          --android-project-arg ai=1

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/PiliPlus_AI_2.1.2-ai.1_arm64-v8a.apk
          sha256sum dist/PiliPlus_AI_2.1.2-ai.1_arm64-v8a.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: PiliPlus-AI-arm64
          path: |
            dist/PiliPlus_AI_2.1.2-ai.1_arm64-v8a.apk
            dist/SHA256SUMS.txt
