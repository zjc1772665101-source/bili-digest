name: Cleanup v0.4.2 temporary branches

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'release-v0.4.2-finalize'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main for authenticated git remote
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete remaining temporary branches
        shell: bash
        run: |
          set +e
          git push origin --delete release-v0.4.2-finalize
          git push origin --delete release-v0.4.2-finalize2
          exit 0
