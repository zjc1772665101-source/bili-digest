name: Apply v0.4.2 payload from PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release-v0.4.2-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v0.4.2-final
          fetch-depth: 0
      - name: Apply verified v0.4.2 payload
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .release-payload/v042-00.part
            .release-payload/v042-01a.part
            .release-payload/v042-01b.part
            .release-payload/v042-02.part
            .release-payload/v042-03.part
            .release-payload/v042-04.part
            .release-payload/v042-05.part
            .release-payload/v042-06a.part
            .release-payload/v042-06b.part
            .release-payload/v042-07.part
          )
          for f in "${parts[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Waiting for $f"
              exit 0
            fi
          done
          cat "${parts[@]}" > /tmp/v042.b64
          echo '487ac47f929d456b8608626d2b7e6e8d9a7479eb5747d62662c330b39ead3da1  /tmp/v042.b64' | sha256sum -c -
          base64 -d /tmp/v042.b64 > /tmp/v042.tar.gz
          echo '02ae307dc04bfc8207043d10cb9ec4afaae6f2185f83aad2118c681e79c8b959  /tmp/v042.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v042.tar.gz -C .
          node scripts/check.js
          set +e
          npm test 2>&1 | tee /tmp/v042-test.log
          test_status=${PIPESTATUS[0]}
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$test_status" -ne 0 ]; then
            cp /tmp/v042-test.log .release-test.log
            git add .release-test.log
            git commit -m 'ci: capture v0.4.2 test failure' || true
            git push origin HEAD:release-v0.4.2-final
            exit "$test_status"
          fi
          rm -rf .release-payload
          rm -f .release-test.log
          rm -f .github/workflows/apply-v042-payload.yml
          git add -A
          git commit -m 'release: v0.4.2 final'
          git push origin HEAD:release-v0.4.2-final
