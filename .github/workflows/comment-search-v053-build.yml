name: Assemble v0.5.3 comment search

on:
  push:
    branches:
      - agent/comment-search-v0.5.3

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble source from v0.5.2 baseline
        run: python scripts/assemble-comments-v053.py

      - name: Run tests
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Verify version and comment coverage
        shell: bash
        run: |
          node -e "const m=require('./manifest.json'); const p=require('./package.json'); if(m.version!=='0.5.3'||p.version!=='0.5.3') process.exit(1)"
          grep -q 'tab-btn-comments' sidepanel.html
          grep -q '/x/v2/reply/wbi/main' comments.js
          grep -q '/x/v2/reply/reply' comments.js
          grep -q 'fetchAllChildren(root, controller.signal' comments.js

      - name: Commit assembled source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.js manifest.json options.html package.json sidepanel.html sidepanel.js comments.js comments.css lib/comments-util.js test/run-all.js test/comments.test.js
          git commit -m "feat: add exhaustive comment search"
          git push origin HEAD:agent/comment-search-v0.5.3
